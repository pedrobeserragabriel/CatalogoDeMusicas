<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo Musical - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/musicas}">CatalogoMusical</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/musicas}">Listagem</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/musicas/novo}">Cadastro</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-11 col-md-8 col-xl-5 mx-auto">
            <div class="card mt-4 mb-4">
                <div class="card-body">
                    <h2 class="text-center mb-4" th:text="${catalogoModel.id} != null ? 'Editar Música' : 'Nova Música'"></h2>

                    <!-- Formulário para Cadastrar Música -->
                    <form th:if="${catalogoModel.id} == null"
                          th:action="@{/musicas}" method="post"
                          enctype="multipart/form-data" th:object="${catalogoModel}"
                          class="mx-auto">

                        <div class="mb-3">
                            <label for="nome" class="form-label"><strong>Nome*:</strong></label>
                            <input th:field="*{nome}" id="nome" type="text" class="form-control" required placeholder="Insira o nome da música">
                            <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="album" class="form-label"><strong>Álbum*:</strong></label>
                            <input th:field="*{album}" id="album" type="text" class="form-control" required placeholder="Insira o nome do álbum">
                            <div class="text-danger small" th:if="${#fields.hasErrors('album')}" th:errors="*{album}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="artistas" class="form-label"><strong>Artistas*:</strong></label>
                            <input th:field="*{artistas}" id="artistas" type="text" class="form-control" required placeholder="Insira os artistas (separados por vírgula)">
                            <div class="text-danger small" th:if="${#fields.hasErrors('artistas')}" th:errors="*{artistas}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="tempoSegundos" class="form-label"><strong>Duração (em segundos)*:</strong></label>
                            <input th:field="*{tempoSegundos}" id="tempoSegundos" type="number" min="1" class="form-control" required placeholder="Tempo em Segundos">
                            <div class="text-danger small" th:if="${#fields.hasErrors('tempoSegundos')}" th:errors="*{tempoSegundos}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="arquivo" class="form-label"><strong>Arquivo de Áudio*:</strong></label>
                            <input type="file" id="arquivo" name="arquivo" accept="audio/*" class="form-control" required>
                            <div class="text-danger small" th:if="${erroArquivo}" th:text="${erroArquivo}"></div>
                        </div>

                        <div class="mb-3">
                            <div class="small">
                                <p class="form-text">* Campos obrigatórios</p>
                            </div>
                        </div>

                        <div class="d-flex gap-2 float-end">
                            <a th:href="@{/musicas}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-dark">Cadastrar</button>
                        </div>
                    </form>

                    <!-- Editar Música -->
                    <form th:if="${catalogoModel.id} != null"
                          th:action="@{/musicas/{id}(id=${catalogoModel.id})}" method="post"
                          enctype="multipart/form-data" th:object="${catalogoModel}"
                          class="mx-auto">

                        <input type="hidden" name="_method" value="put"/>

                        <div class="mb-3">
                            <label for="nome" class="form-label"><strong>Nome*:</strong></label>
                            <input th:field="*{nome}" id="nome" type="text" class="form-control" required placeholder="Insira o nome da música">
                            <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="album" class="form-label"><strong>Álbum*:</strong></label>
                            <input th:field="*{album}" id="album" type="text" class="form-control" required placeholder="Insira o nome do álbum">
                            <div class="text-danger small" th:if="${#fields.hasErrors('album')}" th:errors="*{album}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="artistas" class="form-label"><strong>Artistas*:</strong></label>
                            <input th:field="*{artistas}" id="artistas" type="text" class="form-control" required placeholder="Insira os artistas ( separados por vírgula )">
                            <div class="text-danger small" th:if="${#fields.hasErrors('artistas')}" th:errors="*{artistas}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="tempoSegundos" class="form-label"><strong>Duração (em segundos)*:</strong></label>
                            <input th:field="*{tempoSegundos}" id="tempoSegundos" type="number" min="1" class="form-control" required placeholder="Tempo em Segundos">
                            <div class="text-danger small" th:if="${#fields.hasErrors('tempoSegundos')}" th:errors="*{tempoSegundos}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="arquivo" class="form-label"><strong>Trocar Arquivo de Áudio (opcional):</strong></label>
                            <input type="file" id="arquivo" name="arquivo" accept="audio/*" class="form-control">
                        </div>

                        <div class="mb-3">
                            <div class="small">
                                <p class="form-text">* Campos obrigatórios</p>
                            </div>
                        </div>

                        <div class="d-flex gap-2 float-end">
                            <a th:href="@{/musicas}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-dark">Atualizar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
